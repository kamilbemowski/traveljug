name: Weekly Vulnerability Scan

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC
  workflow_dispatch: # Manual trigger for testing

permissions:
  issues: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable

      - run: flutter pub get

      - name: Run osv-scanner
        id: scan
        continue-on-error: true
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner --lockfile pubspec.lock

      - name: Check outdated packages
        id: outdated
        continue-on-error: true
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          dart pub outdated --json 2>/dev/null | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              for pkg in data.get('packages', []):
                  name = pkg.get('package', '?')
                  current = pkg.get('current', {}).get('version', '?')
                  latest = pkg.get('latest', {}).get('version', '?')
                  if current != latest:
                      print(f'- {name}: {current} → {latest}')
          except: pass
          " >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create issue if vulnerabilities found
        if: steps.scan.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['vulnerability'],
              state: 'open',
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Weekly vuln scan — ${new Date().toISOString().split('T')[0]}`,
                body: 'osv-scanner found vulnerabilities in pubspec.lock. See scan logs: ' +
                  `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ['vulnerability'],
              });
            }
