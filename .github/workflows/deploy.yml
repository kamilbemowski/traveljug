name: Build & Deploy to Firebase

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable

      - run: flutter pub get
      - run: flutter test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable

      - run: flutter pub get

      - name: Decode google-services.json
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - name: Configure Maps API key
        run: echo "MAPS_API_KEY=$MAPS_API_KEY" >> android/app/local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Patch compileSdk for firebase_app_distribution_android
        run: |
          sed -i 's/compileSdkVersion 30/compileSdkVersion 35/' \
            ~/.pub-cache/hosted/pub.dev/firebase_app_distribution_android-1.3.0/android/build.gradle

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME"/release.keystore
          echo "KEYSTORE_PATH=$HOME/release.keystore" >> "$GITHUB_ENV"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Setup Firebase auth
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$HOME"/firebase-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute to Firebase App Distribution
        run: |
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "testers" \
            --release-notes "${{ github.event.head_commit.message }}"
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        run: |
          BASE="v$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)"
          TAG="${BASE}-${{ github.run_number }}"
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "$TAG" \
            --notes "${{ github.event.head_commit.message }}" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
