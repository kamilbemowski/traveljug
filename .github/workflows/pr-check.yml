name: PR Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable

      - run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build

      - name: Decode google-services.json
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Patch compileSdk
        run: |
          sed -i 's/compileSdkVersion 30/compileSdkVersion 35/' \
            ~/.pub-cache/hosted/pub.dev/firebase_app_distribution_android-*/android/build.gradle

      - name: Configure Maps API key
        run: echo "MAPS_API_KEY=$MAPS_API_KEY" >> android/app/local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Vulnerability scan (osv-scanner)
        continue-on-error: true
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner --lockfile pubspec.lock

      - name: Check outdated packages (info only)
        continue-on-error: true
        run: dart pub outdated --json || true
