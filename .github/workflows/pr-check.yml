name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable

      - run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build

      - name: Decode google-services.json
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Patch compileSdk
        run: |
          sed -i 's/compileSdkVersion 30/compileSdkVersion 35/' \
            ~/.pub-cache/hosted/pub.dev/firebase_app_distribution_android-1.3.0/android/build.gradle

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
