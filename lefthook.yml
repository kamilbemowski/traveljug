# Lefthook git hooks configuration for TravelJug
# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    analyze:
      run: flutter analyze
    test:
      run: flutter test

commit-msg:
  commands:
    ticket-ref:
      run: bash -c 'grep -qE "(re)?#\d+" .git/COMMIT_EDITMSG || echo "⚠️  No ticket reference found in commit message"'
