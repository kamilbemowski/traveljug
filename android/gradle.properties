org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Suppress KGP warnings from plugins still on old Kotlin Gradle Plugin
# (firebase_app_distribution, flutter_carplay, flutter_places_sdk).
# builtInKotlin=true would break these plugins — can't mix old KGP with built-in.
android.suppressUnsupportedKotlinPluginVersionCheck=true
# firebase_app_distribution_android ma compileSdkVersion=30, ale jego
# zależności (androidx.window, activity, itp.) wymagają 34+. Wyciszamy
# sprawdzanie AAR metadata dla tego SDK level.
android.suppressUnsupportedCompileSdk=30,31,32,33,34
